[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kids-learning-games"
version = "0.1.0"
description = "A bright, child-friendly learning game for Fedora KDE"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8"]

[project.gui-scripts]
kids-learning-games = "kids_learning_app.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kids_learning_app = ["data/*.txt"]

